name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  # Weekly rebuild so published tags pick up base image (marcortola/php-fpm-nginx) and Alpine
  # package security releases without waiting for a commit. Runs after the base image's own
  # Monday 02:17 UTC rebuild.
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

# Documentation-only PRs retain successful validation jobs without running toolchains or tests.
# Dependency, source and workflow edits always run the complete gate.
jobs:
  test_main:
    name: Test MAIN
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [ base, debug ]
        php: [ 8.5 ]
        wordpress: [ 7 ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select validation scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # checkout uses the synthetic PR merge; its first parent is the target branch.
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/ci-changes"
          run=false
          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "$path" in
              README.md|AGENTS.md|CLAUDE.md|docs/*.md) ;;
              *) run=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changes"
          if [ "$changed" = false ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo 'Documentation-only change; validation check remains successful.'
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            WP_VERSION=${{ matrix.wordpress }}
          tags: php-fpm-nginx-wordpress:ci
          load: true
          # Scheduled and dispatched rebuilds skip the layer cache so apk packages (imagemagick etc.)
          # refresh. The push step below reuses these fresh layers, so it publishes what was tested.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }}
          cache-to: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }},mode=max

      - name: Start Container with Health Check
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run -d --rm \
            --name test \
            -p 10000:80 \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx-wordpress:ci

      - name: Wait for container
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 1
        run: |
          while status="$(docker inspect -f '{{ .State.Health.Status }}' test)"; do
            case $status in
              starting) sleep 1;;
              healthy) exit 0;;
              unhealthy) exit 1;;
            esac
          done
          exit 1

      - name: Test
        if: steps.changes.outputs.run == 'true'
        # No database in CI: this page renders only once the WordPress bootstrap has run.
        run: curl -s http://localhost:10000 | grep -q 'Error establishing a database connection'

      # Root mode installs WordPress owned by www-data, with the rendered wp-config.php as
      # before: mode 644, not group-writable.
      - name: Test root mode ownership
        if: steps.changes.outputs.run == 'true'
        run: |
          for path in wp-config.php index.php wp-content; do
            stat="$(docker exec test stat -c '%U:%G' "/var/www/$path")"
            [ "$stat" = www-data:www-data ] || { echo "/var/www/$path belongs to $stat"; exit 1; }
          done
          mode="$(docker exec test stat -c '%a' /var/www/wp-config.php)"
          [ "$mode" = 644 ] || { echo "wp-config.php has mode $mode"; exit 1; }
          [ "$(docker exec test ls /etc/nginx/server-default)" = single-site.conf ]

      # A working directory that holds a wp-config.php but no WordPress gets WordPress installed
      # around it: the render is skipped and the file is kept.
      - name: Test root mode keeps an existing wp-config.php
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs test-root-config; docker rm -f test-root-config > /dev/null; docker volume rm test-root-config-www > /dev/null; exit "$status"' EXIT
          docker volume create test-root-config-www > /dev/null
          docker run --rm -v test-root-config-www:/var/www --entrypoint sh php-fpm-nginx-wordpress:ci \
            -c "printf '<?php\n// kept\n' > /var/www/wp-config.php"
          docker run -d \
            --name test-root-config \
            -v test-root-config-www:/var/www \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx-wordpress:ci
          while status="$(docker inspect -f '{{ .State.Health.Status }}' test-root-config)"; do
            case $status in
              starting) sleep 1;;
              healthy) break;;
              *) echo "container is $status"; exit 1;;
            esac
          done
          [ "$status" = healthy ]
          docker exec test-root-config test -e /var/www/wp-includes/version.php || { echo 'WordPress is not installed'; exit 1; }
          config="$(docker exec test-root-config cat /var/www/wp-config.php)"
          [ "$config" = "$(printf '<?php\n// kept')" ] || { echo "wp-config.php was replaced: $config"; exit 1; }

      # Non-root mode, as consumers run their dev containers: an arbitrary uid with group 0 added
      # (see README.md). A new named volume at /var/www copies the image's /var/www, which group 0
      # can write, and the image's wp-content, which belongs to www-data.
      - name: Test non-root mode with a named volume
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs test-nonroot-volume; docker rm -f test-nonroot-volume > /dev/null; docker volume rm test-nonroot-www > /dev/null; exit "$status"' EXIT
          wait_healthy() {
            while status="$(docker inspect -f '{{ .State.Health.Status }}' test-nonroot-volume)"; do
              case $status in
                starting) sleep 1;;
                healthy) return 0;;
                *) echo "container is $status"; return 1;;
              esac
            done
            return 1
          }
          docker volume create test-nonroot-www > /dev/null
          docker run -d \
            --name test-nonroot-volume \
            --user 1000:1000 \
            --group-add 0 \
            -p 10001:80 \
            -v test-nonroot-www:/var/www \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx-wordpress:ci
          wait_healthy

          # Every process runs as the requested uid, and every file the install wrote belongs to it.
          users="$(docker exec test-nonroot-volume ps -o user= | sort -u)"
          [ "$users" = 1000 ] || { echo "processes run as: $users"; exit 1; }
          docker exec test-nonroot-volume test -e /var/www/wp-includes/version.php || { echo 'WordPress is not installed'; exit 1; }
          foreign="$(docker exec test-nonroot-volume find /var/www -type f ! -user 1000)"
          [ -z "$foreign" ] || { echo "not owned by uid 1000: $foreign"; exit 1; }

          # wp-config.php is rendered, the single-site configuration is in use, and WordPress runs.
          docker exec test-nonroot-volume test -s /var/www/wp-config.php || { echo 'wp-config.php is missing'; exit 1; }
          if docker exec test-nonroot-volume grep -F '$WP_' /var/www/wp-config.php; then
            echo 'wp-config.php is not rendered'; exit 1
          fi
          [ "$(docker exec test-nonroot-volume ls /etc/nginx/server-default)" = single-site.conf ]
          docker exec test-nonroot-volume grep -qxF 'location / {' /etc/nginx/server-default/single-site.conf
          curl -s http://localhost:10001 | grep -q 'Error establishing a database connection'

          # A second start finds WordPress installed and serves it again.
          docker restart test-nonroot-volume > /dev/null
          wait_healthy
          [ "$(docker exec test-nonroot-volume ls /etc/nginx/server-default)" = single-site.conf ]
          curl -s http://localhost:10001 | grep -q 'Error establishing a database connection'

      # The project bind-mounted at /var/www, owned by the uid the container runs as: nothing the
      # container writes there may belong to root or www-data (82).
      - name: Test non-root mode with a bind mount
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          www="$RUNNER_TEMP/nonroot-www"
          mkdir -p "$www"
          # The runner user is not uid 1000; hand the mount to the uid the container runs as.
          sudo chown 1000:1000 "$www"
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs test-nonroot-bind; docker rm -f test-nonroot-bind > /dev/null; exit "$status"' EXIT
          docker run -d \
            --name test-nonroot-bind \
            --user 1000:1000 \
            --group-add 0 \
            -p 10002:80 \
            -v "$www:/var/www" \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx-wordpress:ci
          while status="$(docker inspect -f '{{ .State.Health.Status }}' test-nonroot-bind)"; do
            case $status in
              starting) sleep 1;;
              healthy) break;;
              *) echo "container is $status"; exit 1;;
            esac
          done
          [ "$status" = healthy ]

          curl -s http://localhost:10002 | grep -q 'Error establishing a database connection'
          [ -e "$www/wp-includes/version.php" ] || { echo 'WordPress is not installed'; exit 1; }
          foreign="$(find "$www" ! -uid 1000)"
          [ -z "$foreign" ] || { echo "not owned by uid 1000:"; find "$www" ! -uid 1000 -exec ls -lnd {} +; exit 1; }

      # A WordPress in a subdirectory of /var/www uses the multisite-directory configuration.
      # Docker creates a missing working directory as root with mode 755, so the subdirectory
      # exists in the bind mount already, owned by the uid.
      - name: Test non-root mode in a subdirectory
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          www="$RUNNER_TEMP/nonroot-subdir-www"
          mkdir -p "$www/subdir"
          sudo chown -R 1000:1000 "$www"
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs test-nonroot-subdir; docker rm -f test-nonroot-subdir > /dev/null; exit "$status"' EXIT
          wait_healthy() {
            while status="$(docker inspect -f '{{ .State.Health.Status }}' test-nonroot-subdir)"; do
              case $status in
                starting) sleep 1;;
                healthy) return 0;;
                *) echo "container is $status"; return 1;;
              esac
            done
            return 1
          }
          docker run -d \
            --name test-nonroot-subdir \
            --user 1000:1000 \
            --group-add 0 \
            -p 10003:80 \
            -v "$www:/var/www" \
            -w /var/www/subdir \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx-wordpress:ci
          wait_healthy

          [ "$(docker exec test-nonroot-subdir ls /etc/nginx/server-default)" = multisite-directory.conf ]
          docker exec test-nonroot-subdir grep -qxF 'location /subdir {' /etc/nginx/server-default/multisite-directory.conf
          curl -s http://localhost:10003/subdir/ | grep -q 'Error establishing a database connection'
          [ -e "$www/subdir/wp-includes/version.php" ] || { echo 'WordPress is not installed in subdir'; exit 1; }
          [ ! -e "$www/index.php" ] || { echo 'WordPress is installed in /var/www too'; exit 1; }
          foreign="$(find "$www" ! -uid 1000)"
          [ -z "$foreign" ] || { echo "not owned by uid 1000:"; find "$www" ! -uid 1000 -exec ls -lnd {} +; exit 1; }

          # A second start finds wp-config.php in the subdirectory and still renders the
          # subdirectory into the nginx configuration.
          docker restart test-nonroot-subdir > /dev/null
          wait_healthy
          docker exec test-nonroot-subdir grep -qxF 'location /subdir {' /etc/nginx/server-default/multisite-directory.conf
          curl -s http://localhost:10003/subdir/ | grep -q 'Error establishing a database connection'

      # The same in root mode, where Docker creates the working directory inside the container.
      - name: Test root mode in a subdirectory
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          trap 'status=$?; [ "$status" -eq 0 ] || docker logs test-root-subdir; docker rm -f test-root-subdir > /dev/null; exit "$status"' EXIT
          wait_healthy() {
            while status="$(docker inspect -f '{{ .State.Health.Status }}' test-root-subdir)"; do
              case $status in
                starting) sleep 1;;
                healthy) return 0;;
                *) echo "container is $status"; return 1;;
              esac
            done
            return 1
          }
          docker run -d \
            --name test-root-subdir \
            -p 10004:80 \
            -w /var/www/subdir \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx-wordpress:ci
          wait_healthy
          [ "$(docker exec test-root-subdir ls /etc/nginx/server-default)" = multisite-directory.conf ]
          docker exec test-root-subdir grep -qxF 'location /subdir {' /etc/nginx/server-default/multisite-directory.conf
          curl -s http://localhost:10004/subdir/ | grep -q 'Error establishing a database connection'

          # A second start finds wp-config.php in the subdirectory and still renders the
          # subdirectory into the nginx configuration.
          docker restart test-root-subdir > /dev/null
          wait_healthy
          docker exec test-root-subdir grep -qxF 'location /subdir {' /etc/nginx/server-default/multisite-directory.conf
          curl -s http://localhost:10004/subdir/ | grep -q 'Error establishing a database connection'

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            WP_VERSION=${{ matrix.wordpress }}
          tags: marcortola/php-fpm-nginx-wordpress:${{ matrix.php }}${{ (matrix.target != 'base' && format('-{0}', matrix.target)) || '' }}
          push: true
          cache-from: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }}
          cache-to: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }},mode=max

  # GitHub disables scheduled workflows in public repositories after 60 days without repository
  # activity. Re-enabling the workflow on every scheduled run keeps the weekly rebuild alive.
  keepalive:
    name: Keep schedule enabled
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPOSITORY/actions/workflows/ci.yml/enable"
