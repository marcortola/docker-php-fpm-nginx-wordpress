name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  # Weekly rebuild so published tags pick up base image (marcortola/php-fpm-nginx) and Alpine
  # package security releases without waiting for a commit. Runs after the base image's own
  # Monday 02:17 UTC rebuild.
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

# Documentation-only PRs retain successful validation jobs without running toolchains or tests.
# Dependency, source and workflow edits always run the complete gate.
jobs:
  test_main:
    name: Test MAIN
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [ base, debug ]
        php: [ 8.5 ]
        wordpress: [ 7 ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select validation scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # checkout uses the synthetic PR merge; its first parent is the target branch.
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/ci-changes"
          run=false
          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "$path" in
              README.md|AGENTS.md|CLAUDE.md|docs/*.md) ;;
              *) run=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changes"
          if [ "$changed" = false ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo 'Documentation-only change; validation check remains successful.'
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            WP_VERSION=${{ matrix.wordpress }}
          tags: php-fpm-nginx-wordpress:ci
          load: true
          # Scheduled and dispatched rebuilds skip the layer cache so apk packages (imagemagick etc.)
          # refresh. The push step below reuses these fresh layers, so it publishes what was tested.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }}
          cache-to: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }},mode=max

      - name: Start Container with Health Check
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run -d --rm \
            --name test \
            -p 10000:80 \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx-wordpress:ci

      - name: Wait for container
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 1
        run: |
          while status="$(docker inspect -f '{{ .State.Health.Status }}' test)"; do
            case $status in
              starting) sleep 1;;
              healthy) exit 0;;
              unhealthy) exit 1;;
            esac
          done
          exit 1

      - name: Test
        if: steps.changes.outputs.run == 'true'
        # No database in CI: this page renders only once the WordPress bootstrap has run.
        run: curl -s http://localhost:10000 | grep -q 'Error establishing a database connection'

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            WP_VERSION=${{ matrix.wordpress }}
          tags: marcortola/php-fpm-nginx-wordpress:${{ matrix.php }}${{ (matrix.target != 'base' && format('-{0}', matrix.target)) || '' }}
          push: true
          cache-from: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }}
          cache-to: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}-wp-${{ matrix.wordpress }},mode=max

  # GitHub disables scheduled workflows in public repositories after 60 days without repository
  # activity. Re-enabling the workflow on every scheduled run keeps the weekly rebuild alive.
  keepalive:
    name: Keep schedule enabled
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPOSITORY/actions/workflows/ci.yml/enable"
