# Host ports are generic knobs, so several stacks can run side by side (one per
# git worktree, say): HOST_PORT_APP_80 (default 10000), HOST_PORT_APP_SUBDIR_80
# (10001) and HOST_PORT_APP_DEV_80 (10002). Unset or empty, each keeps its default.
# The project is named after the checkout directory; pass -p or COMPOSE_PROJECT_NAME
# for another stack beside one of the same name.
version: "3.8"

services:
  
  app:
    image: marcortola/php-fpm-nginx-wordpress:8.5
    ports:
      - '${HOST_PORT_APP_80:-10000}:80'
    volumes:
      - wp_content:/var/www/wp-content
    environment:
      - WP_DB_NAME=secret
      - WP_DB_USER=secret
      - WP_DB_PASSWORD=secret
      - WP_DB_HOST=localhost
  
  app_subdir:
    image: marcortola/php-fpm-nginx-wordpress:8.5
    working_dir: /var/www/subdir
    ports:
      - '${HOST_PORT_APP_SUBDIR_80:-10001}:80'
    volumes:
      - wp_content:/var/www/subdir/wp-content
    environment:
      - WP_DB_NAME=secret
      - WP_DB_USER=secret
      - WP_DB_PASSWORD=secret
      - WP_DB_HOST=localhost
            
  app_dev:
    image: marcortola/php-fpm-nginx-wordpress:8.5-debug
    ports:
      - '${HOST_PORT_APP_DEV_80:-10002}:80'
    volumes:
      - wp_content:/var/www/wp-content
    environment:
      - XDEBUG_MODE=${XDEBUG_MODE:-debug}
      - WP_DB_NAME=secret
      - WP_DB_USER=secret
      - WP_DB_PASSWORD=secret
      - WP_DB_HOST=localhost
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  wp_content:
